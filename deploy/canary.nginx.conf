# Drop into /etc/nginx/sites-available/canary, then:
#   sudo ln -s /etc/nginx/sites-available/canary /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare terminates TLS at the edge; origin can stay HTTP if you trust the
# CF tunnel (or use Full/Strict with a CF Origin Cert). Adjust server_name.

server {
    listen 80;
    listen [::]:80;
    server_name canary.example.com;

    # Only accept traffic proxied by Cloudflare (optional but recommended).
    # Refresh CF ranges periodically: https://www.cloudflare.com/ips/
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # ...
    # real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/canary.access.log;
    error_log  /var/log/nginx/canary.error.log;

    client_max_body_size 64k;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
