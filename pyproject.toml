[project]
name = "proxyfp"
version = "0.1.0"
description = "Fingerprint proxy/anonymizer sites and submit them to Palo Alto URL categorization."
requires-python = ">=3.11"
dependencies = [
    # Base install = canary server only. Keep this list minimal.
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
proxyfp = "proxyfp.cli:app"

[project.optional-dependencies]
fingerprint = [
    # Everything the local fingerprinter + PAN submitter needs.
    "httpx[http2]>=0.27",
    "playwright>=1.44",
    "typer>=0.12",
    "mmh3>=4.1",
    "dnspython>=2.6",
    "cymruwhois>=1.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]
dev = [
    "proxyfp[fingerprint]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxyfp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
